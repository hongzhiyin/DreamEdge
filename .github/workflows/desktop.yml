name: Desktop build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  checks:
    name: Check source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    name: Package ${{ matrix.name }}
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            platform: mac
            arch: arm64
          - name: mac-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: win-x64
            os: windows-2022
            platform: win
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - name: Build installation packages
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify desktop from source
        run: npm run test:desktop
      - name: Verify packaged application
        run: npm run test:packaged
      - name: Upload installation packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ideadock-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create draft release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ideadock-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/checksums.mjs release-assets
      - name: Save packages to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "A published release already exists; refusing to replace its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$REPOSITORY" \
              --verify-tag --draft --title "IdeaDock $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
